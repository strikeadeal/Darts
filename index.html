<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0a" />
    <meta
      name="description"
      content="Nine Dart Rush, 301, Cricket, Around the Clock and Shanghai. An offline darts arcade for solo runs and local duels."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dartshift" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <link
      rel="preload"
      href="./assets/fonts/Anton-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Dartshift</title>
  </head>
  <body>
    <nav class="hud" aria-label="Game controls">
      <button id="back" class="glass" aria-label="Save and return home" hidden></button>
      <span class="hud-right"><button id="help" class="glass"></button><button id="audio" class="glass"></button></span>
    </nav>
    <main id="main">
      <!-- One room for every screen. Each .cam layer gets the same camera
           transform; the play shot is the identity, so the throw reads an
           untransformed board. -->
      <div id="scene" class="scene" data-shot="intro">
        <div class="cam wallfx" aria-hidden="true">
          <div class="panels"></div>
          <div class="lamp"></div>
          <div class="flare"></div>
          <div class="surround"></div>
          <div class="skirting"></div>
          <div class="neon">
            <svg viewBox="0 0 38 28"><path d="M1 7 38 3l-3 7H10zm9 6h24l-3 6H18zm10 9h10l-3 5z" /></svg>
            <span>NINE DART</span><b>RUSH</b>
          </div>
        </div>
        <div class="cam floorfx" aria-hidden="true">
          <div class="floor"><i class="mat"></i><i class="oche"></i></div>
        </div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="cam" id="stage"></div>
      </div>
      <div id="panel"></div>
    </main>
    <aside id="update" class="toast" hidden>
      <span>New version ready.</span><button id="apply">Update game</button><button id="later">Later</button>
    </aside>
    <p id="updated" class="toast" role="status" hidden></p>
    <aside id="install" class="toast install" aria-labelledby="install-title" hidden>
      <p><strong id="install-title">Add Dartshift to your Home Screen.</strong> Tap Share, then Add to Home Screen. It plays offline, full screen, and keeps its own records. Records in this Safari tab don’t move to the app.</p>
      <button id="install-ok">OK</button>
    </aside>
    <p id="storage-note" class="toast" hidden>
      Storage is unavailable. This session can still be played.
    </p>
    <dialog id="modal"><div id="sheet"></div></dialog>
    <div id="announce" class="sr" role="status" aria-live="polite"></div>
    <noscript>Enable JavaScript to play Dartshift.</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
